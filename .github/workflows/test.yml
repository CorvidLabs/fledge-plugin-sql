name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify dependencies
        run: |
          which bash sqlite3 jq python3
          bash --version
          sqlite3 --version
          python3 --version

      - name: Shell-syntax check
        run: bash -n bin/fledge-sql

      - name: Run integration tests
        run: python3 test/test.py
